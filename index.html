<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Intelligence Terminal</title><style>*{box-sizing:border-box}body{margin:0;background:#dce1e5;color:#101418;font-family:Arial,sans-serif}.card{height:calc(100dvh - 24px);margin:12px;border:2px solid #20272b;border-radius:23px;padding:3vw;display:flex;flex-direction:column}.top,.foot{display:flex;align-items:center;gap:12px}.top{font-size:clamp(13px,1.7vw,20px);font-weight:bold}.tag{background:#101418;color:white;padding:6px 12px;border-radius:4px}.device{margin-left:auto;font-size:12px;color:#505860}h1{font-size:clamp(38px,4.9vw,76px);line-height:1.12;letter-spacing:-.025em;margin:4vh 0 16px}#question{font-size:clamp(20px,2.7vw,37px);line-height:1.3;margin:0}.grow{flex:1}.rule{height:2px;background:#20272b;margin:12px 0}.label{font-size:clamp(14px,1.6vw,20px);font-weight:800;margin-bottom:10px}#answer{font-size:clamp(22px,2.9vw,42px);line-height:1.3;margin:0}.foot{justify-content:space-between;font-size:12px;color:#525b62;margin-top:12px}.actions{display:flex;gap:9px;align-items:center;margin-top:10px}.btn{font-size:clamp(12px,1.3vw,17px);border:1.5px solid #101418;border-radius:25px;padding:8px 13px;color:#101418;text-decoration:none;background:transparent;cursor:pointer;font-weight:bold}.dark{background:#101418;color:white}#status{margin-left:auto;font-size:11px}@media(max-height:560px){.card{padding:18px 25px}h1{font-size:clamp(33px,4.5vw,55px);margin:14px 0}#question{font-size:clamp(18px,2.5vw,28px)}#answer{font-size:clamp(20px,2.6vw,31px)}}@media(max-width:600px){.device{display:none}}</style></head><body><main class="card"><div class="top"><span class="tag" id="tag"></span><span id="topic"></span><span class="device"></span></div><h1 id="title"></h1><p id="question"></p><div class="grow"></div><div class="rule"></div><div class="label">SELF-CHECK</div><p id="answer"></p><div class="grow"></div><div class="foot"><span id="edition"></span><span id="count"></span></div><div class="actions"><a id="chat" class="btn" target="_blank" rel="noopener">Explain with ChatGPT ↗</a><button class="btn dark" id="full">Full screen</button><button class="btn" id="prev">◀</button><button class="btn" id="next">▶</button><span id="status">Loading…</span></div></main><script>
let datasets={},data=null,i=0,t=Date.now(),pause=0,mode='',lastUpdate='';
const el=id=>document.getElementById(id);
const files={stocks:'cards.json',lessons:'lessons.json',engineering:'engineering.json'};
function pacificHour(){return Number(new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',hourCycle:'h23'}).format(new Date()))}
function desiredMode(){const h=pacificHour();return h>=9&&h<10?'lessons':h>=10&&h<17?'engineering':'stocks'}
function choose(){const wanted=desiredMode();const selected=datasets[wanted]?wanted:'stocks';const next=datasets[selected];if(!next)return;if(mode!==selected||data!==next){mode=selected;data=next;i=0;show()}el('status').textContent=(wanted!==selected?'Awaiting '+wanted+' feed · ':'')+(lastUpdate?'Checked '+lastUpdate:'Loading')}
function show(){if(!data||!data.cards.length)return;const c=data.cards[i];el('tag').textContent=c.category;el('topic').textContent=c.topic;el('title').textContent=c.title;el('question').textContent=c.question;el('answer').textContent=c.selfCheck;el('edition').textContent=(mode==='stocks'?'Market Intelligence':mode==='lessons'?'Market Lessons':'Engineering Influence')+' · '+data.date;el('count').textContent='Card '+(i+1)+'/'+data.cards.length;el('chat').href='https://chatgpt.com/?q='+encodeURIComponent('Explain '+(c.prompt||c.title)+'. Give relevant evidence, intuition and practical lessons.');t=Date.now()}
function move(n){if(!data)return;i=(i+n+data.cards.length)%data.cards.length;pause=Date.now()+120000;show()}
el('next').onclick=()=>move(1);el('prev').onclick=()=>move(-1);el('full').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>{});
async function refresh(){for(const [key,path] of Object.entries(files)){try{const r=await fetch(path+'?ts='+Date.now(),{cache:'no-store'});if(!r.ok)continue;const d=await r.json();if(!Array.isArray(d.cards)||!d.cards.length||!d.cards.every(c=>['category','topic','title','question','selfCheck'].every(k=>typeof c[k]==='string')))continue;if(key==='stocks'&&d.cards.length!==6)continue;if(JSON.stringify(datasets[key])!==JSON.stringify(d))datasets[key]=d}catch(e){}}lastUpdate=new Date().toLocaleTimeString();choose()}
refresh();setInterval(refresh,300000);setInterval(()=>{choose();if(data&&Date.now()>pause&&Date.now()-t>=65000){i=(i+1)%data.cards.length;show()}},1000);
</script></body></html>
